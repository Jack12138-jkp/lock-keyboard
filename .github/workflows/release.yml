name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LockKeyboard ${{ github.ref_name }}'
          releaseBody: |
            ## 🎉 新版本发布 / New Release

            ### 📦 下载 / Downloads
            请根据您的操作系统选择对应的安装包：
            Please choose the installer for your operating system:

            - **macOS**: `.dmg` 文件 (支持 Intel 和 Apple Silicon / Supports Intel & Apple Silicon)
            - **Windows**: `.msi` 或 `.exe` 文件
            - **Linux**: `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL), 或 `.AppImage` (通用 / Universal)

            ### 📝 更新内容 / Changelog
            查看完整更新日志请访问 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            ### 🐛 问题反馈 / Issue Report
            如遇到问题，请在 [Issues](https://github.com/${{ github.repository }}/issues) 页面反馈
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
